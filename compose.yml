services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
      - label:disable
    networks:
     # Connect to the 'traefik_proxy' overlay network for inter-container communication across nodes
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
      - /home/user/certs:/certs:ro
    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"

      # Attach the static configuration tls.yml file that contains the tls configuration settings
      - "--providers.file.filename=/dynamic/tls.yml"

      # Providers 
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"

      # API & Dashboard 
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # Observability 
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
    configs:
      - source: traefik_tls_config
        target: /dynamic/tls.yml
  # Traefik Dynamic configuration via Docker labels
    labels:
      # Enable self‑routing
      - "traefik.enable=true"

      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.docker.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"

networks:
  proxy:
    name: proxy

configs:
  traefik_tls_config: 
    content: |
      tls:
        certificates:
          - certFile: /certs/local.crt
            keyFile:  /certs/local.key
